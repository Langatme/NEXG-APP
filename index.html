<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is REQUIRED for safe-area insets to work at all.
         Without it `env(safe-area-inset-bottom)` resolves to 0 on every device, so the app
         cannot avoid the home indicator or the notch no matter what CSS asks for. This is the
         switch that makes the insets available; the CSS consumes them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NEXG App</title>
    <meta name="description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />
    <meta property="og:title" content="NEXG App" />
    <meta property="og:description" content="On-demand luxury concierge & gourmet discovery with NEXG bespoke experience and PostgreSQL database." />

    <!-- The mark is the standalone G, lifted from the NEXG wordmark. SVG alone, with no
         .ico fallback: every browser this product targets supports SVG favicons, and a
         multi-size .ico of the same mark would be three binary files to keep in step with
         one source. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark tab strips: the G uses the bright gold accent. Two files rather than one with an
         internal media query, because a favicon is fetched without page context and some
         browsers do not evaluate media queries inside it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#111315" />

    <!-- Fonts are fetched from Google's CDN; opening the connection early keeps the
         first paint from waiting on a cold TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=4593eff3-7143-4aca-ac85-960b221db925"></script>
<!-- impeccable-live-end -->
</body>
</html>
